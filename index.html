<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a09">
  <meta name="description" content="Something is taking shape. Revere Robotics is operating in stealth.">
  <title>Revere Robotics — In stealth</title>
  <link rel="icon" href="forall-logo-white.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="grid" aria-hidden="true"></div>
  <header>
    <a class="brand" href="./" aria-label="Revere Robotics home">REVERE<span>ROBOTICS</span></a>
    <span class="status"><i aria-hidden="true"></i> OPERATING IN STEALTH</span>
  </header>
  <main>
    <div class="artifact" aria-hidden="true">
      <div class="orbit orbit-outer"></div>
      <div class="orbit orbit-inner"></div>
      <span class="coordinate coordinate-left">[ ∀ ]</span>
      <span class="coordinate coordinate-right">UNREVEALED</span>
      <div class="logo-field"><img class="logo" src="forall-logo-white.png" alt="" width="2048" height="2039"></div>
      <div class="scan"></div>
    </div>
    <p class="eyebrow">A QUIET BEGINNING. AN OPEN POSSIBILITY.</p>
    <h1>Some things are better<br>built in silence<span class="period">.</span></h1>
    <div class="transmission">
      <span class="message-number" aria-hidden="true">01 / 04</span>
      <p id="message">Something is taking shape.</p>
    </div>
    <div class="controls">
      <button id="next" type="button">NEXT TRANSMISSION <span aria-hidden="true">↗</span></button>
      <button id="motion" type="button" aria-pressed="false" aria-label="Pause animation">Ⅱ</button>
    </div>
    <p class="sr-only" id="announcement" role="status"></p>
  </main>
  <footer>
    <span>© <span id="year">2026</span> REVERE ROBOTICS</span>
    <span class="footer-note">LESS SAID. MORE POSSIBLE.</span>
    <a href="mailto:hello@reverebots.com">MAKE CONTACT <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
